<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1e40af" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="300" y1="0" x2="300" y2="320" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="600" y1="0" x2="600" y2="320" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="900" y1="0" x2="900" y2="320" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6"/>

  <!-- Logo Shield on Left -->
  <g transform="translate(110, 60) scale(2.0)">
    <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" stroke="url(#grad-accent)" stroke-width="3.5" stroke-linejoin="round" fill="#0b1329" fill-opacity="0.9"/>
    <circle cx="50" cy="50" r="32" stroke="url(#grad-accent)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="50" cy="50" r="22" stroke="url(#grad-accent)" stroke-width="1.2" opacity="0.8"/>
    <circle cx="50" cy="50" r="22" fill="url(#lens-glow)"/>
    <line x1="50" y1="12" x2="50" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="80" x2="50" y2="88" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="50" x2="26" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="50" x2="82" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M53 22L36 50H49L47 78L66 48H52L53 22Z" fill="url(#gold)" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="360" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#38bdf8">DC VOLTAGE NETWORK</text>
  
  <text x="360" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="0.5" fill="#f8fafc">DC VOLTAGE AI NVR</text>
  
  <text x="360" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#94a3b8">Intelligent Surveillance. Zero Blind Spots.</text>

  <!-- Badges on right bottom -->
  <g transform="translate(360, 245)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Universal Cameras</text>
    
    <rect x="150" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="215" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">30 AI Detectors</text>

    <rect x="290" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="365" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#818cf8">English &amp; മലയാളം</text>

    <rect x="450" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="520" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b">SHA-256 Vault</text>
  </g>
</svg>
