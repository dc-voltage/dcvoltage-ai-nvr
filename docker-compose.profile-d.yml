# ==============================================================================
# DC VOLTAGE AI NVR — PROFILE D: HIGH-PERFORMANCE ENTERPRISE AI CLUSTER
# Multi-GPU Acceleration • Local Ollama LLM Sidecar • 32-128 GB RAM • 16-64+ Cameras
# ==============================================================================

services:
  dcv-ai-nvr:
    container_name: dcvoltage-ai-nvr-cluster
    image: dcvoltage/ai-nvr:latest-tensorrt
    pull_policy: missing
    restart: unless-stopped
    privileged: true
    shm_size: "2048mb"
    depends_on:
      - dcv-ollama-llm
    environment:
      - TZ=UTC
      - DCV_PROFILE=D
      - DCV_CONFIG_DIR=/config/dcv
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - FRIGATE_RTSP_PASSWORD=dcv_secure_vault_pass
      - AI_ASSISTANT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 4000000000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"

  dcv-ollama-llm:
    container_name: dcvoltage-ollama-llm
    image: ollama/ollama:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
